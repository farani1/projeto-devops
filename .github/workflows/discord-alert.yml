name: Alerta Discord

on:
  push:
    branches:
      - main
      - semana6-alertas
      - ajuste-alerta-discord

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar alerta para o Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg actor "$ACTOR" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT_MESSAGE" \
            '{
              content: (
                "🚀 **Alerta DevOps**\n" +
                "Repositório: " + $repository + "\n" +
                "Autor: " + $actor + "\n" +
                "Branch: " + $branch + "\n" +
                "Commit: " + $commit
              )
            }')

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"